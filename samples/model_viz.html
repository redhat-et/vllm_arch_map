            .attr('stroke', '#30363d').attr('stroke-width', 1.5);
          g.append('polygon').attr('points', `${mx},${y2} ${mx - 4},${y2 - 6} ${mx + 4},${y2 - 6}`).attr('fill', '#30363d');
          const prevOp = steps[i - 1].opData;
          const edgeLabel = prevOp && prevOp.dims ? prevOp.dims : (steps[i - 1].edge || '');
          if (edgeLabel) g.append('text').attr('x', mx + 8).attr('y', (y1 + y2) / 2 + 3).attr('fill', '#58a6ff').attr('font-size', '8px').text(edgeLabel);
        }
        R.push({ y, h: H }); y += H + 14;
      });
      return y;
    }

    function vTop() {
      const g = mkG();
      const mt = M.module_tree;
      const pre = M.pre_model_ops || [];
      const post = M.post_model_ops || [];

      g.append('text').attr('x', 60).attr('y', 20).attr('fill', '#58a6ff').attr('font-size', '13px').attr('font-weight', 'bold')
        .text(`${mt.class} — ${G.device} | ${G.dtype} | ${M.mode} mode`);
      g.append('text').attr('x', 60).attr('y', 36).attr('fill', '#8b949e').attr('font-size', '10px')
        .text(`${fmtUs(mt.dur_us)} model forward | ${M.layers} layers | ${M.stats.total_cpu_ops} cpu ops → ${M.stats.total_kernels} GPU kernels`);

      const steps = [];

      if (pre.length) {
        const preTotal = pre.reduce((s, o) => s + o.dur_us, 0);
        const preItems = pre.filter(o => o.dur_us > 5).slice(0, 4).map(o => {
          const gpuStr = o.gpu ? o.gpu : (o.gpu_note || '');
          return { t: `${o.op}: ${fmtUs(o.dur_us)} ${gpuStr}`, c: '#8b949e' };
        });
        steps.push({
          label: `Pre-Model — ${pre.length} ops`,
          sub: `Scheduler, input prep | ${fmtUs(preTotal)}`,
          col: C.sched, badge: fmtUs(preTotal),
          items: preItems,
          click: () => nav('pre'),
        });
      }

      const children = mt.children || [];
      children.forEach(child => {
        const rep = child.repeat ? ` ×${child.repeat}` : '';
        const cChildren = child.children || [];
        const cOps = child.ops || [];
        const dur = child.avg_dur_us || child.dur_us;

        const items = [];
        cChildren.forEach(cc => {
          const ccDur = cc.avg_dur_us || cc.dur_us || 0;
          const ccOps = (cc.ops || []).length + (cc.children || []).length;
          items.push({ t: `${cc.class}: ${fmtUs(ccDur)} (${ccOps} items)`, c: '#c9d1d9' });
        });
        cOps.slice(0, 3).forEach(op => {
          const gpuStr = op.gpu ? `→ ${op.gpu}` : (op.gpu_note || '');
          items.push({ t: `${op.op} ${fmtUs(op.avg_us || op.dur_us)} ${gpuStr}`, c: '#8b949e' });
        });
        if (cOps.length > 3) items.push({ t: `... +${cOps.length - 3} more ops`, c: '#484f58' });

        if (child.per_layer_dur) {
          items.push({ t: `avg: ${fmtUs(child.avg_dur_us)} | min: ${fmtUs(child.min_dur_us)} | max: ${fmtUs(child.max_dur_us)}`, c: C.gemm.s });
        }

        const hasContent = cChildren.length > 0 || cOps.length > 0;
        steps.push({
          label: `${child.class}${rep}`,
          sub: `${fmtUs(dur)} | ${cChildren.length} sub-modules | ${cOps.length} direct ops`,
          col: child.repeat ? C.gemm : C.embed,
          badge: fmtUs(child.repeat ? dur * child.repeat : dur),
          items,
          click: hasContent ? () => nav('mod', child) : null,
          tipHtml: hasContent ? buildModTooltip(child) : null,
        });
      });

      if (post.length) {
        const postTotal = post.reduce((s, o) => s + o.dur_us, 0);
        const postItems = post.filter(o => o.dur_us > 2).slice(0, 6).map(o => {
          const gpuStr = o.gpu ? `→ ${o.gpu}` : (o.gpu_note || '');
          const d = o.dims ? ` | ${o.dims}` : '';
          return { t: `${o.op}: ${fmtUs(o.dur_us)} ${gpuStr}${d}`, c: '#8b949e' };
        });
        steps.push({
          label: `Post-Model — ${post.length} ops`,
          sub: `LM Head + Sampling | ${fmtUs(postTotal)}`,
          col: C.out, badge: fmtUs(postTotal),
          items: postItems,
          click: () => nav('post'),
        });
      }

      steps.push({ label: 'Output Token', col: C.tensor, dashed: true });

      dia(g, steps, { w: 660 });

      const dlayer = children.find(c => c.repeat);
      if (dlayer && dlayer.per_layer_dur) {
        const sg = g.append('g').attr('transform', 'translate(760,40)');
        let sy = layerBars(sg, dlayer.per_layer_dur, { onClick: i => nav('layer', i) });

        sy += 16;
        sg.append('text').attr('y', sy).attr('fill', '#58a6ff').attr('font-size', '10px').attr('font-weight', 'bold').text('Kernel Summary');
        sy += 14;
        Object.entries(M.kernel_summary || {}).slice(0, 12).forEach(([name, kv]) => {
          const short = name.length > 40 ? name.slice(0, 37) + '...' : name;
          sg.append('text').attr('y', sy).attr('fill', '#8b949e').attr('font-size', '8px')
            .text(`${kv.count}× ${kv.role} — ${short} — ${fmtUs(kv.total_dur_us)}`);
          sy += 12;
        });
      }
    }

    function vLayer(layerIdx) {
      const g = mkG(), gc = F.gpu_chain;
      const nl = gc.layers;
      const tmpl = gc.layer_template;
      const totalTmpl = tmpl.reduce((s, x) => s + x.avg_us, 0);

      if (layerIdx == null) {
        g.append('text').attr('x', 60).attr('y', 20).attr('fill', '#58a6ff').attr('font-size', '13px').attr('font-weight', 'bold')
          .text(`Decoder Layer — ${tmpl.length} ops/layer | ${nl} layers`);

        const steps = [];
        tmpl.forEach((t, i) => {
          const pct = (100 * t.avg_us / totalTmpl).toFixed(1);
          const gpuLine = t.gpu_display ? `GPU: ${t.gpu_display}` : `CPU: ${t.op}`;
          const argsStr = (t.args || []).map(a => `${a.name}${fmtShape(a.shape)}`).join(', ');
          steps.push({
            label: t.label,
            sub: `${gpuLine}`,
            col: rc(t.role),
            badge: fmtUs(t.avg_us),
            opData: t,
            items: [
              { t: `${argsStr}`, c: '#c9d1d9' },
              { t: `avg: ${fmtUs(t.avg_us)} | min: ${fmtUs(t.min_us)} | max: ${fmtUs(t.max_us)} | ${pct}%`, c: rc(t.role).s },
            ],
            click: () => nav('step', t),
          });
        });

        dia(g, steps, { w: 620 });

        const sg = g.append('g').attr('transform', 'translate(720,40)');
        const layerTotals = gc.per_layer.map(l => l.total_us);
        layerBars(sg, layerTotals, { title: 'Per-Layer Total Time', onClick: i => nav('layer', i) });

      } else {
        const ld = gc.per_layer[layerIdx];
        if (!ld) return;
        const ops = ld.ops;
        const totalUs = ld.total_us;

        g.append('text').attr('x', 60).attr('y', 20).attr('fill', '#58a6ff').attr('font-size', '13px').attr('font-weight', 'bold')
          .text(`Layer ${layerIdx} — ${ops.length} ops | ${fmtUs(totalUs)} total`);

        const steps = ops.map((k, i) => {
          const dur = k.gpu_dur_us || k.dur_us;
          const gpuLine = k.gpu_display ? `GPU: ${k.gpu_display} (${fmtUs(k.gpu_dur_us || 0)})` : `CPU: ${k.op} (${fmtUs(k.dur_us)})`;
          const argsStr = (k.args || []).map(a => `${a.name}${fmtShape(a.shape)}`).join(', ');
          return {
            label: k.label,
            sub: `${gpuLine}`,
            col: rc(k.role),
            badge: fmtUs(dur),
            opData: k,
            items: [
              ...(argsStr ? [{ t: argsStr, c: '#c9d1d9' }] : []),
              { t: `cpu: ${fmtUs(k.dur_us)}${k.gpu_dur_us ? ' | gpu: ' + fmtUs(k.gpu_dur_us) : ''}`, c: '#8b949e' },
            ],
          };
        });

        dia(g, steps, { w: 620 });

        const sg = g.append('g').attr('transform', 'translate(720,40)');
        sg.append('text').attr('fill', '#58a6ff').attr('font-size', '11px').attr('font-weight', 'bold').text(`Layer ${layerIdx} vs Average`);
        let sy = 18;
        ops.forEach((k, i) => {
          const dur = k.gpu_dur_us || k.dur_us;
          const avg = (i < tmpl.length) ? tmpl[i].avg_us : dur;
          const diff = dur - avg;
          const diffPct = avg > 0 ? ((diff / avg) * 100).toFixed(0) : '0';
          const color = diff > avg * 0.1 ? '#f85149' : diff < -avg * 0.1 ? '#2ea043' : '#8b949e';
          sg.append('text').attr('y', sy).attr('fill', color).attr('font-size', '9px')
            .text(`${k.label}: ${fmtUs(dur)} (${diff >= 0 ? '+' : ''}${diffPct}%)`);
          sy += 14;
        });
      }
    }

    function vStep(stepData) {
      const g = mkG(), gc = F.gpu_chain, nl = gc.layers;

      const gpuInfo = stepData.gpu_display ? ` — ${stepData.gpu_display}` : ` — ${stepData.op}`;
      const dimsInfo = stepData.dims ? ` | ${stepData.dims}` : '';
      g.append('text').attr('x', 60).attr('y', 20).attr('fill', '#58a6ff').attr('font-size', '13px').attr('font-weight', 'bold')
        .text(`${stepData.label}${gpuInfo}`);
      g.append('text').attr('x', 60).attr('y', 36).attr('fill', '#8b949e').attr('font-size', '10px')
        .text(`avg: ${fmtUs(stepData.avg_us)} | min: ${fmtUs(stepData.min_us)} | max: ${fmtUs(stepData.max_us)} | across ${nl} layers${dimsInfo}`);

      const durs = stepData.all_layer_durs || [];
      if (!durs.length) return;

      const maxDur = Math.max(...durs);
      const barW = 500, barH = 12, gap = 3;
      const sg = g.append('g').attr('transform', 'translate(60,55)');

      durs.forEach((d, i) => {
        const y = i * (barH + gap);
        const bw = Math.max(2, barW * d / maxDur);
        const cl = rc(stepData.role);

        sg.append('rect').attr('x', 0).attr('y', y).attr('width', bw).attr('height', barH)
          .attr('rx', 2).attr('fill', cl.f).attr('stroke', cl.s).attr('stroke-width', 1)
          .style('cursor', 'pointer')
          .on('click', () => nav('layer', i))
          .on('mouseover', function (evt) {
            d3.select(this).attr('stroke-width', 2);
            tip(evt, `<b>Layer ${i}</b><br>${fmtUs(d)}<br>vs avg: ${(((d - stepData.avg_us) / stepData.avg_us) * 100).toFixed(1)}%`);
          })
          .on('mouseout', function () { d3.select(this).attr('stroke-width', 1); tipHide(); });

        sg.append('text').attr('x', bw + 6).attr('y', y + 10).attr('fill', '#c9d1d9').attr('font-size', '9px')
          .text(`L${i}: ${fmtUs(d)}`);
      });

      const avg = stepData.avg_us;
      const rg = g.append('g').attr('transform', `translate(620, 55)`);
      rg.append('text').attr('fill', '#58a6ff').attr('font-size', '11px').attr('font-weight', 'bold').text('Statistics');
      let ry = 16;
      if (stepData.dims) { rg.append('text').attr('y', ry).attr('fill', '#c9d1d9').attr('font-size', '9px').text(`Input: ${stepData.dims}`); ry += 12; }
      if (stepData.gpu_display) { rg.append('text').attr('y', ry).attr('fill', '#8b949e').attr('font-size', '9px').text(`GPU: ${stepData.gpu_display}`); ry += 12; }
      rg.append('text').attr('y', ry).attr('fill', '#c9d1d9').attr('font-size', '9px').text(`op: ${stepData.op}`); ry += 16;
      rg.append('text').attr('y', ry).attr('fill', '#c9d1d9').attr('font-size', '9px').text(`Average: ${fmtUs(avg)}`); ry += 12;
      rg.append('text').attr('y', ry).attr('fill', '#c9d1d9').attr('font-size', '9px').text(`Min: ${fmtUs(stepData.min_us)}`); ry += 12;
      rg.append('text').attr('y', ry).attr('fill', '#c9d1d9').attr('font-size', '9px').text(`Max: ${fmtUs(stepData.max_us)}`); ry += 12;
      const variance = durs.reduce((s, d) => s + (d - avg) ** 2, 0) / durs.length;
      rg.append('text').attr('y', ry).attr('fill', '#c9d1d9').attr('font-size', '9px').text(`StdDev: ${fmtUs(Math.sqrt(variance))}`); ry += 12;
      rg.append('text').attr('y', ry).attr('fill', '#c9d1d9').attr('font-size', '9px').text(`CV: ${((Math.sqrt(variance) / avg) * 100).toFixed(1)}%`); ry += 16;
      const totalAcrossLayers = durs.reduce((s, d) => s + d, 0);
      rg.append('text').attr('y', ry).attr('fill', '#8b949e').attr('font-size', '9px').text(`Total across ${nl} layers: ${fmtUs(totalAcrossLayers)}`);

      const subs = stepData.sub_ops;
      if (subs && subs.length) {
        const barsH = durs.length * (barH + gap) + 20;
        const sg2 = g.append('g').attr('transform', `translate(60,${55 + barsH})`);
        sg2.append('text').attr('fill', '#58a6ff').attr('font-size', '11px').attr('font-weight', 'bold')
          .text(`CPU → GPU Dispatch (${subs.length} child ops)`);
        sg2.append('line').attr('x1', 0).attr('y1', 6).attr('x2', 560).attr('y2', 6)
          .attr('stroke', '#21262d').attr('stroke-width', 1);

        let sy = 22;
        const hdrs2 = [['CPU Operation', 0], ['Duration', 220], ['Input Shapes', 300], ['GPU Dispatch', 520]];
        hdrs2.forEach(([t, hx]) => {
          sg2.append('text').attr('x', hx).attr('y', sy).attr('fill', '#8b949e')
            .attr('font-size', '8px').attr('font-weight', 'bold').text(t);
        });
        sy += 14;

        function renderSubs(list, depth) {
          list.forEach(sub => {
            const indent = depth * 12;
            const hasGpu = !!sub.gpu_display;
            const opColor = hasGpu ? '#f0883e' : '#7ee787';
            sg2.append('text').attr('x', indent).attr('y', sy).attr('fill', opColor)
              .attr('font-size', '9px').text((depth ? '└ ' : '') + sub.op);
            sg2.append('text').attr('x', 220).attr('y', sy).attr('fill', '#c9d1d9')
              .attr('font-size', '9px').text(fmtUs(sub.dur_us));
            if (sub.dims) sg2.append('text').attr('x', 300).attr('y', sy).attr('fill', '#8b949e')
              .attr('font-size', '9px').text(sub.dims.substring(0, 40));
            if (hasGpu) {
              sg2.append('text').attr('x', 520).attr('y', sy).attr('fill', '#f0883e')
                .attr('font-size', '9px').text(sub.gpu_display + ' (' + fmtUs(sub.gpu_dur_us) + ')');
            } else {
              sg2.append('text').attr('x', 520).attr('y', sy).attr('fill', '#484f58')
                .attr('font-size', '9px').text(sub.gpu_note || 'CPU-only');
            }
            sy += 14;
            if (sub.sub_ops) renderSubs(sub.sub_ops, depth + 1);
          });
        }
        renderSubs(subs, 0);
      }
    }

    function vPost() {
      const g = mkG(), gc = F.gpu_chain;
      const postTotal = gc.post_layers.reduce((s, k) => s + (k.gpu_dur_us || k.dur_us), 0);

      g.append('text').attr('x', 60).attr('y', 20).attr('fill', '#58a6ff').attr('font-size', '13px').attr('font-weight', 'bold')
        .text(`Post-Layer — ${gc.post_layers.length} ops | ${fmtUs(postTotal)} total`);

      const steps = gc.post_layers.map(k => {
        const argsStr = (k.args || []).map(a => `${a.name}${fmtShape(a.shape)}`).join(', ');
        return {
          label: k.label,
          sub: k.gpu_display ? `GPU: ${k.gpu_display}` : `CPU: ${k.op}`,
          col: rc(k.role),
          badge: fmtUs(k.gpu_dur_us || k.dur_us),
          opData: k,
          items: [
            ...(argsStr ? [{ t: argsStr, c: '#c9d1d9' }] : []),
            { t: `cpu: ${fmtUs(k.dur_us)}${k.gpu_dur_us ? ' | gpu: ' + fmtUs(k.gpu_dur_us) : ''}`, c: '#8b949e' },
          ],
        };
      });

      dia(g, steps, { w: 620 });
    }

    function vPre() {
      const g = mkG(), gc = F.gpu_chain;
      const preTotal = gc.pre_layers.reduce((s, k) => s + (k.gpu_dur_us || k.dur_us), 0);

      g.append('text').attr('x', 60).attr('y', 20).attr('fill', '#58a6ff').attr('font-size', '13px').attr('font-weight', 'bold')
        .text(`Pre-Layer — ${gc.pre_layers.length} ops | ${fmtUs(preTotal)} total`);

      const steps = gc.pre_layers.map(k => {
        const argsStr = (k.args || []).map(a => `${a.name}${fmtShape(a.shape)}`).join(', ');
        return {
          label: k.label || k.op,
          sub: k.gpu_display ? `GPU: ${k.gpu_display}` : `CPU: ${k.op}`,
          col: rc(k.role),
          badge: fmtUs(k.gpu_dur_us || k.dur_us),
          opData: k,
          items: [
            ...(argsStr ? [{ t: argsStr, c: '#c9d1d9' }] : []),
          ],
        };
      });

      dia(g, steps, { w: 620 });
    }

    function vMod(mod) {
      const g = mkG();
      const repeatLabel = mod.repeat ? ` ×${mod.repeat} (showing layer 0)` : '';
      const modDur = mod.avg_dur_us || mod.dur_us;
      g.append('text').attr('x', 60).attr('y', 20).attr('fill', '#58a6ff').attr('font-size', '13px').attr('font-weight', 'bold')
        .text(`${mod.class}${repeatLabel}`);
      g.append('text').attr('x', 60).attr('y', 36).attr('fill', '#8b949e').attr('font-size', '10px')
        .text(`${fmtUs(modDur)} | ${(mod.children || []).length} sub-modules | ${(mod.ops || []).length} direct ops`);
      renderModContent(g, mod, 60, 50, 660);
      if (mod.all_layer_durs && mod.all_layer_durs.length > 1) {
        const rg = g.append('g').attr('transform', `translate(760,40)`);
        layerBars(rg, mod.all_layer_durs, {
          title: `Per-Layer — ${mod.class}`,
          onClick: i => nav('layer', i),
        });
      }
    }

    boot();
  </script>
</body>

</html>
