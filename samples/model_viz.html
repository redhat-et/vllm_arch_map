<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>GPU Execution Flow</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: #0d1117;
      color: #c9d1d9
    }

    #hdr {
      padding: 10px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      gap: 16px
    }

    #hdr h1 {
      font-size: 14px;
      color: #58a6ff
    }

    #hdr .i {
      font-size: 11px;
      color: #8b949e
    }

    .tab-bar {
      display: flex;
      gap: 0;
      margin-left: auto
    }

    .tab-btn {
      background: none;
      border: none;
      color: #8b949e;
      font-family: inherit;
      font-size: 12px;
      padding: 8px 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s
    }

    .tab-btn:hover {
      color: #c9d1d9
    }

    .tab-btn.active {
      color: #58a6ff;
      border-bottom-color: #58a6ff
    }

    .tab-btn:disabled {
      opacity: 0.3;
      cursor: default
    }

    #bc {
      padding: 6px 20px;
      background: #0d1117;
      border-bottom: 1px solid #21262d;
      font-size: 12px;
      display: flex;
      gap: 4px;
      flex-wrap: wrap
    }

    #bc span {
      cursor: pointer;
      color: #58a6ff
    }

    #bc span:hover {
      text-decoration: underline
    }

    #bc .c {
      color: #c9d1d9;
      cursor: default
    }

    #bc .s {
      color: #484f58;
      cursor: default
    }

    svg#svg {
      width: 100%;
      height: calc(100vh - 68px);
      display: block
    }

    .tt {
      position: fixed;
      background: #1c2128;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 10px;
      color: #c9d1d9;
      pointer-events: none;
      z-index: 100;
      max-width: 700px;
      line-height: 1.4;
      font-family: 'SF Mono', 'Fira Code', monospace
    }

    .tt .ftitle {
      color: #58a6ff;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 11px
    }

    .tt .frow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0
    }

    .tt .finputs {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .tt .fbox {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 9px;
      white-space: nowrap;
      line-height: 1.4
    }

    .tt .fbox.op {
      border-color: #58a6ff;
      background: #1a2a3a;
      padding: 8px 12px;
      text-align: center
    }

    .tt .fbox.out {
      border-color: #2ea043;
      background: #1a3a2a
    }

    .tt .farr {
      color: #58a6ff;
      font-size: 14px;
      flex-shrink: 0
    }

    .tt .fname {
      color: #7ee787;
      font-weight: bold;
      display: block
    }

    .tt .fdim {
      color: #c9d1d9;
      display: block
    }

    .tt .ftype {
      color: #8b949e;
      font-size: 8px;
      display: block
    }

    .tt .foplabel {
      color: #e6edf3;
      font-weight: bold;
      display: block
    }

    .tt .fopgpu {
      color: #f0883e;
      font-size: 8px;
      display: block;
      margin-top: 2px
    }

    .tt .foptime {
      color: #8b949e;
      font-size: 8px;
      display: block;
      margin-top: 2px
    }

    #workload-view,
    #inspector-view {
      display: none;
      padding: 24px 32px;
      overflow-y: auto;
      height: calc(100vh - 68px);
      background: #0d1117
    }

    .wl-section {
      margin-bottom: 24px
    }

    .wl-title {
      color: #58a6ff;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px
    }

    .wl-subtitle {
      color: #8b949e;
      font-size: 11px;
      margin-bottom: 16px
    }

    .wl-meta {
      display: flex;
      gap: 24px;
      margin-bottom: 20px;
      flex-wrap: wrap
    }

    .wl-meta-item {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px 16px;
      min-width: 120px
    }

    .wl-meta-item .label {
      color: #8b949e;
      font-size: 9px;
      text-transform: uppercase;
      margin-bottom: 4px
    }

    .wl-meta-item .value {
      color: #e6edf3;
      font-size: 14px;
      font-weight: bold
    }

    .wl-meta-item .unit {
      color: #8b949e;
      font-size: 10px
    }

    .req-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s;
      margin-bottom: 2px
    }

    .req-row:hover {
      background: #161b22
    }

    .req-row.hotspot {
      border-left: 3px solid #f85149
    }

    .req-label {
      color: #e6edf3;
      font-size: 11px;
      font-weight: bold;
      min-width: 70px
    }

    .req-tokens {
      color: #8b949e;
      font-size: 9px;
      min-width: 100px
    }

    .req-bar-container {
      flex: 1;
      height: 20px;
      position: relative
    }

    .req-total {
      color: #8b949e;
      font-size: 10px;
      min-width: 70px;
      text-align: right
    }

    .req-click-hint {
      color: #484f58;
      font-size: 10px
    }

    .gap-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 16px 4px 82px;
      color: #484f58;
      font-size: 9px
    }

    .gap-row .gap-line {
      flex: 1;
      height: 1px;
      background: #21262d
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px
    }

    .summary-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 16px
    }

    .summary-card .card-label {
      color: #8b949e;
      font-size: 9px;
      text-transform: uppercase;
      margin-bottom: 6px
    }

    .summary-card .card-value {
      color: #e6edf3;
      font-size: 16px;
      font-weight: bold
    }

    .summary-card .card-detail {
      color: #8b949e;
      font-size: 9px;
      margin-top: 4px
    }

    .card-per-req {
      margin-top: 6px;
      font-size: 9px;
      color: #8b949e;
      line-height: 1.6
    }

    .card-per-req span {
      color: #e6edf3;
      font-weight: bold;
      margin-left: 2px
    }

    .metric-section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 8px
    }

    .metric-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px
    }

    .metric-name {
      color: #58a6ff;
      font-size: 11px;
      font-weight: bold;
      cursor: help;
      border-bottom: 1px dotted #58a6ff;
      position: relative
    }

    .metric-name .tip {
      display: none;
      position: absolute;
      left: 0;
      top: 100%;
      margin-top: 4px;
      background: #1c2333;
      border: 1px solid #58a6ff;
      border-radius: 6px;
      padding: 8px 12px;
      color: #c9d1d9;
      font-size: 10px;
      font-weight: normal;
      line-height: 1.5;
      white-space: pre-wrap;
      width: 420px;
      z-index: 100;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .5)
    }

    .metric-name:hover .tip {
      display: block
    }

    .mod-tree {
      font-size: 10px;
      line-height: 1.1
    }

    .mod-node {
      margin-bottom: 2px
    }

    .mod-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 4px;
      border-radius: 3px;
      cursor: pointer
    }

    .mod-row:hover {
      background: #21262d
    }

    .mod-toggle {
      color: #58a6ff;
      font-size: 9px;
      width: 12px;
      text-align: center;
      flex-shrink: 0
    }

    .mod-info {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0
    }

    .mod-cls {
      color: #e6edf3;
      font-weight: bold;
      font-size: 10px;
      white-space: nowrap
    }

    .mod-pct {
      color: #8b949e;
      font-size: 9px;
      min-width: 36px;
      text-align: right;
      flex-shrink: 0
    }

    .mod-bar-track {
      flex: 1;
      height: 10px;
      background: #0d1117;
      border-radius: 3px;
      overflow: hidden;
      max-width: 200px
    }

    .mod-bar-fill {
      height: 100%;
      border-radius: 3px;
      min-width: 1px
    }

    .mod-dur-label {
      color: #8b949e;
      font-size: 9px;
      min-width: 50px
    }

    .mod-detail {
      color: #484f58;
      font-size: 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .mod-op-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 4px;
      font-size: 9px;
      color: #8b949e
    }

    .mod-op-row .mod-bar-track {
      max-width: 120px
    }

    .mod-gpu-name {
      color: #79c0ff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 300px
    }

    .mod-warn {
      background: #2a1a0a;
      border: 1px solid #f0883e;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 12px;
      color: #f0883e;
      font-size: 10px
    }

    .metric-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px
    }

    .metric-bar-label {
      color: #8b949e;
      font-size: 9px;
      min-width: 55px;
      text-align: right
    }

    .metric-bar-track {
      flex: 1;
      height: 16px;
      background: #0d1117;
      border-radius: 3px;
      position: relative;
      overflow: hidden
    }

    .metric-bar-fill {
      height: 100%;
      border-radius: 3px;
      display: flex;
      align-items: center;
      padding-left: 6px;
      font-size: 8px;
      color: #fff;
      font-weight: bold;
      min-width: 2px
    }

    .metric-bar-value {
      color: #e6edf3;
      font-size: 10px;
      font-weight: bold;
      min-width: 70px;
      text-align: right
    }

    .run-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .run-meta-chip {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 3px 10px;
      font-size: 9px;
      color: #e6edf3
    }

    .run-meta-chip .chip-label {
      color: #8b949e;
      margin-right: 3px
    }

    .insp-back {
      color: #58a6ff;
      font-size: 11px;
      cursor: pointer;
      margin-bottom: 16px;
      display: inline-block
    }

    .insp-back:hover {
      text-decoration: underline
    }

    .insp-summary {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap
    }

    .insp-pill {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 11px
    }

    .insp-pill .pill-label {
      color: #8b949e;
      font-size: 9px;
      margin-right: 4px
    }

    .insp-pill .pill-value {
      color: #e6edf3;
      font-weight: bold
    }

    .insp-pill.hotspot-pill {
      border-color: #f85149;
      background: #2a1a1a
    }

    .insp-pill.hotspot-pill .pill-value {
      color: #f85149
    }

    .kernel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px
    }

    .kernel-table th {
      color: #8b949e;
      font-size: 9px;
      text-transform: uppercase;
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid #30363d;
      cursor: pointer;
      user-select: none;
      white-space: nowrap
    }

    .kernel-table th:hover {
      color: #58a6ff
    }

    .kernel-table th .sort-arrow {
      margin-left: 4px;
      font-size: 8px
    }

    .kernel-table td {
      padding: 5px 8px;
      border-bottom: 1px solid #21262d;
      color: #c9d1d9;
      white-space: nowrap
    }

    .kernel-table tr:hover td {
      background: #161b22
    }

    .kernel-table .kname {
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e6edf3
    }

    .occ-cell {
      font-weight: bold;
      border-radius: 3px;
      padding: 2px 6px;
      display: inline-block;
      font-size: 9px
    }

    .occ-good {
      background: #1a3a2a;
      color: #2ea043
    }

    .occ-mid {
      background: #2a2a1a;
      color: #d29922
    }

    .occ-bad {
      background: #2a1a1a;
      color: #f85149
    }

    .itl-chart {
      margin-top: 16px
    }

    .mt-node {
      margin-bottom: 1px
    }

    .mt-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 4px;
      border-radius: 3px;
      cursor: pointer;
      min-height: 22px
    }

    .mt-row:hover {
      background: #21262d
    }

    .mt-toggle {
      color: #58a6ff;
      font-size: 9px;
      width: 14px;
      text-align: center;
      flex-shrink: 0;
      font-family: monospace
    }

    .mt-cls {
      color: #e6edf3;
      font-weight: bold;
      font-size: 10px;
      white-space: nowrap;
      min-width: 180px
    }

    .mt-repeat {
      color: #8b949e;
      font-size: 9px;
      margin-left: 2px
    }

    .mt-val {
      font-size: 9px;
      min-width: 70px;
      text-align: right;
      padding: 1px 4px;
      border-radius: 2px
    }

    .mt-val.selected {
      font-weight: bold;
      font-size: 10px
    }

    .mt-pct {
      color: #484f58;
      font-size: 8px;
      min-width: 36px;
      text-align: right
    }

    .mt-children {
      margin-left: 16px;
      border-left: 1px solid #21262d
    }

    .mt-op {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 4px;
      font-size: 9px;
      min-height: 20px
    }

    .mt-op:hover {
      background: #1a1f26
    }

    .mt-op-name {
      color: #7ee787;
      min-width: 160px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .mt-op-gpu {
      color: #79c0ff;
      font-size: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
      min-width: 100px
    }

    .mt-header {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 4px;
      border-bottom: 1px solid #30363d;
      margin-bottom: 4px;
      font-size: 9px;
      color: #8b949e
    }

    .mt-header .mt-cls {
      color: #8b949e;
      font-weight: normal;
      font-size: 9px;
      text-transform: uppercase
    }

    .req-sel {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .req-sel-btn {
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 3px 10px;
      font-size: 9px;
      color: #8b949e;
      cursor: pointer;
      background: none;
      font-family: inherit;
      transition: all .15s
    }

    .req-sel-btn:hover {
      border-color: #58a6ff;
      color: #c9d1d9
    }

    .mt-split {
      display: flex;
      gap: 16px;
      align-items: flex-start
    }

    .mt-split .mt-tree-col {
      flex: 1;
      min-width: 0;
      overflow-x: auto
    }

    .mt-split .mt-chart-col {
      width: 300px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px;
      max-height: calc(100vh - 200px);
      overflow-y: auto
    }

    .mt-chart-title {
      color: #58a6ff;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .mt-chart-subtitle {
      color: #8b949e;
      font-size: 8px;
      margin-bottom: 8px
    }

    .mt-row.chart-selected {
      background: #1a2a3a;
      border: 1px solid #58a6ff40
    }

    .mt-op.chart-selected {
      background: #1a2a3a;
      border: 1px solid #58a6ff40;
      border-radius: 3px
    }

    .req-sel-btn.active {
      border-color: #58a6ff;
      color: #58a6ff;
      background: #1a2a3a;
      font-weight: bold
    }

    .heatmap-container {
      margin: 8px 0 12px 16px;
      overflow-x: auto
    }

    .heatmap-cell {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 2px;
      margin: 1px;
      cursor: default
    }
  </style>
</head>

<body>
  <div id="hdr">
    <h1 id="t">Loading...</h1>
    <span class="i" id="inf"></span>
    <div class="tab-bar" id="tabs"></div>
  </div>
  <div id="bc"></div>
  <svg id="svg"></svg>
  <div id="workload-view"></div>
  <div id="inspector-view"></div>
  <div class="tt" id="tip" style="display:none"></div>
  <script>
    let G, F, M, W, P, stk = [{ id: 'top' }];
    let currentTab = 'arch';
    let inspectReqIdx = 0;

    const C = {
      gemm: { f: '#1a3a2a', s: '#2ea043' }, linear: { f: '#1a3a2a', s: '#2ea043' },
      norm: { f: '#1a2a3a', s: '#58a6ff' }, attn: { f: '#2a1a3a', s: '#bc8cff' },
      act: { f: '#3a2a1a', s: '#f0883e' }, embed: { f: '#1a3a3a', s: '#3fb9a0' },
      kv: { f: '#3a1a2a', s: '#f778ba' }, out: { f: '#2a2a1a', s: '#d2a04a' },
      sched: { f: '#1a1a2a', s: '#8b949e' }, rope: { f: '#2a3a1a', s: '#7ee787' },
      resid: { f: '#161b22', s: '#30363d' }, tensor: { f: '#161b22', s: '#21262d' },
      gpu: { f: '#3a1a1a', s: '#f85149' }, sample: { f: '#2a1a1a', s: '#d2a04a' },
    };
    const RC = {
      gemm: C.gemm, linear: C.linear, embed_norm: C.embed, norm: C.norm,
      rms_norm: C.norm, fused_add_rms_norm: C.norm,
      qk_norm: C.norm, post_attn_norm: C.norm, post_mlp_norm: C.norm,
      kv_cache: C.kv, kv_cache_write: C.kv, kv_cache_update: C.kv,
      flash_attention: C.attn, attention_dispatch: C.attn,
      silu_activation: C.act, silu_and_mul: C.act, softmax: C.act,
      rotary_embedding: C.rope, rotary: C.rope,
      embedding: C.embed, top_k: C.sample, sampling: C.sample, temperature: C.act,
      scheduler: C.sched, index: C.sched, elementwise: C.sched,
      post_sample: C.sched, other: C.sched,
    };
    function rc(role) { return RC[role] || C.sched; }

    const NM = {
      top: 'Model Execution', layer: 'Decoder Layer', step: 'Kernel Step',
      post: 'Post-Layer', pre: 'Pre-Layer', mod: 'Module'
    };

    function fmtMs(ms) {
      if (ms >= 1000) return (ms / 1000).toFixed(2) + 's';
      if (ms >= 1) return ms.toFixed(1) + 'ms';
      return (ms * 1000).toFixed(0) + 'us';
    }

    function fmtNs(ns) {
      const ms = ns / 1e6;
      return fmtMs(ms);
    }

    async function boot() {
      try {
        const cb = '?v=' + Date.now();
        try {
          M = await d3.json('model_execution.json' + cb);
          G = M;
          F = { gpu_chain: M, kernel_summary: M.kernel_summary, total_kernels: M.stats.total_kernels };
        } catch (_) {
          try {
            [G, F] = await Promise.all([d3.json('model_graph.json' + cb), d3.json('execution_flow.json' + cb)]);
          } catch (_2) { G = null; F = null; }
        }

        try {
          W = await d3.json('workload_data.json' + cb);
        } catch (_) { W = null; }

        try {
          P = await d3.json('per_request_profiles.json' + cb);
        } catch (_) { P = null; }

        buildTabs();

        if (W && W.requests && W.requests.length) {
          switchTab('workload');
        } else if (G && M && M.module_tree) {
          d3.select('#t').text(G.model + ' — Model Execution');
          d3.select('#inf').text(`${G.device} | ${G.dtype} | ${G.engine.attention_backend} | ${M.mode} mode | ${M.iterations} iters | ${M.layers} layers`);
          switchTab('arch');
        } else if (W) {
          switchTab('workload');
        } else {
          d3.select('#t').text('Error: no data files found');
        }
      } catch (e) {
        d3.select('#t').text('Error: ' + e.message);
        console.error(e);
      }
    }

    function buildTabs() {
      const bar = d3.select('#tabs').html('');
      if (W && W.requests && W.requests.length) {
        bar.append('button').classed('tab-btn', true).attr('data-tab', 'workload').text('Workload').on('click', () => switchTab('workload'));
      }
      if (P && P.merged_tree) {
        bar.append('button').classed('tab-btn', true).attr('data-tab', 'profiler').text('Profiler').on('click', () => switchTab('profiler'));
      }
      if (M && M.module_tree) {
        bar.append('button').classed('tab-btn', true).attr('data-tab', 'arch').text('Architecture').on('click', () => switchTab('arch'));
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      d3.selectAll('.tab-btn').classed('active', function () { return d3.select(this).attr('data-tab') === tab; });
      d3.select('#svg').style('display', tab === 'arch' ? 'block' : 'none');
      d3.select('#bc').style('display', tab === 'arch' ? 'flex' : 'none');
      d3.select('#workload-view').style('display', tab === 'workload' ? 'block' : 'none');
      d3.select('#inspector-view').style('display', tab === 'profiler' ? 'block' : 'none');

      if (tab === 'arch') {
        if (G) d3.select('#t').text(G.model + ' — Model Execution');
        if (G && M) d3.select('#inf').text(`${G.device} | ${G.dtype} | ${G.engine.attention_backend} | ${M.mode} mode | ${M.iterations} iters | ${M.layers} layers`);
        render();
      } else if (tab === 'workload') {
        d3.select('#t').text('Workload Dashboard');
        d3.select('#inf').text('');
        vWorkload();
      } else if (tab === 'profiler') {
        d3.select('#t').text('Profiler');
        d3.select('#inf').text('');
        vProfiler(inspectReqIdx);
      }
    }

    // ═══ Tab 1: Workload Dashboard ═══
    function vWorkload() {
      const el = d3.select('#workload-view').html('');
      if (!W || !W.requests || !W.requests.length) { el.append('div').text('No workload data loaded.'); return; }

      const reqs = W.requests;
      const meta = W.meta || {};
      const stats = W.summary || {};
      const prom = W.prometheus;
      const gpu = W.gpu;

      // ── Run metadata chips ──
      const chips = el.append('div').classed('run-meta', true);
      function addChip(label, value) { const c = chips.append('span').classed('run-meta-chip', true); c.append('span').classed('chip-label', true).text(label + ':'); c.append('span').text(' ' + value); }
      addChip('Model', meta.model_id || 'unknown');
      addChip('Dataset', meta.dataset || 'unknown');
      addChip('Requests', reqs.length);
      if (gpu && gpu.name) addChip('GPU', gpu.name + (gpu.sm_count ? ` (${gpu.sm_count} SMs)` : ''));
      if (stats.duration != null) addChip('Run Duration', fmtMs(stats.duration * 1000));
      if (stats.output_throughput != null) addChip('Output', stats.output_throughput.toFixed(1) + ' tok/s');
      if (stats.total_token_throughput != null) addChip('Total', stats.total_token_throughput.toFixed(1) + ' tok/s');

      // Tag each request with its original index for click-to-inspect
      reqs.forEach((r, i) => { r._idx = i; });

      // ── Scaling Behavior (Scatter Plots) ──
      const inputToks = reqs.map(r => r.input_tokens || 0);
      const tokLo = Math.min(...inputToks), tokHi = Math.max(...inputToks);
      const hasSpectrum = tokHi > tokLo;
      const queueVals = reqs.map(r => r.queue_ms || 0).sort((a,b) => a - b);
      const queueP75 = queueVals[Math.floor(queueVals.length * 0.75)] || 1;
      let ttftDots, decDots;

      if (hasSpectrum) {
        const scSec = el.append('div').classed('wl-section', true);
        scSec.append('div').classed('wl-title', true).text('Scaling: Latency vs Input Length');

        const sM = {top: 16, right: 14, bottom: 34, left: 56};
        const halfW = 300, sH = 180;
        const pW = halfW - sM.left - sM.right, pH = sH - sM.top - sM.bottom;
        function drawScatter(parent, xKey, xLabel, yKey, title, baseColor) {
          const xVals = reqs.map(d => d[xKey] || 0);
          const xLo2 = Math.min(...xVals), xHi2 = Math.max(...xVals);
          const xS2 = d3.scaleLinear().domain([xLo2 * 0.9, xHi2 * 1.05]).range([0, pW]);
          const yMax = Math.max(...reqs.map(d => d[yKey] || 0)) * 1.15 || 1;
          const yS = d3.scaleLinear().domain([0, yMax]).range([pH, 0]);
          const svg = parent.append('svg').attr('width', halfW).attr('height', sH);
          const g = svg.append('g').attr('transform', `translate(${sM.left},${sM.top})`);
          g.append('g').attr('transform', `translate(0,${pH})`).call(d3.axisBottom(xS2).ticks(5)).selectAll('text').attr('fill', '#8b949e').attr('font-size', '8px');
          g.selectAll('.domain,.tick line').attr('stroke', '#30363d');
          g.append('g').call(d3.axisLeft(yS).ticks(5).tickFormat(v => fmtMs(v))).selectAll('text').attr('fill', '#8b949e').attr('font-size', '8px');
          g.selectAll('.domain,.tick line').attr('stroke', '#30363d');
          svg.append('text').attr('x', halfW / 2).attr('y', 11).attr('text-anchor', 'middle').attr('fill', '#c9d1d9').attr('font-size', '10px').attr('font-weight', '600').text(title);
          svg.append('text').attr('x', halfW / 2).attr('y', sH - 2).attr('text-anchor', 'middle').attr('fill', '#8b949e').attr('font-size', '8px').text(xLabel);
          const dots = g.selectAll('.dot').data(reqs).enter().append('circle')
            .attr('cx', d => xS2(d[xKey] || 0))
            .attr('cy', d => yS(d[yKey] || 0))
            .attr('r', 4.5)
            .attr('fill', d => (d.queue_ms || 0) > queueP75 ? '#f85149' : baseColor)
            .attr('fill-opacity', 0.75)
            .attr('stroke', '#0d1117').attr('stroke-width', 0.5);
          dots.append('title').text(d => `${d.label}: ${d[xKey]||0} ${xLabel.toLowerCase()} → ${fmtMs(d[yKey]||0)}${(d.queue_ms||0)>5 ? ' (queued '+fmtMs(d.queue_ms)+')' : ''}`);
          return dots;
        }

        const scRow = scSec.append('div').style('display', 'flex').style('gap', '4px');
        ttftDots = drawScatter(scRow, 'input_tokens', 'Input Tokens', 'ttft_ms', 'TTFT vs Input Length', '#58a6ff');
        decDots = drawScatter(scRow, 'output_tokens', 'Output Tokens', 'decode_ms', 'Decode vs Output Length', '#2ea043');

        const scLeg = scSec.append('div').style('display', 'flex').style('gap', '16px').style('font-size', '9px').style('margin-top', '4px');
        [{c:'#58a6ff',t:'Normal'},{c:'#f85149',t:`Queued > p75 (${fmtMs(queueP75)})`},{c:'#2ea043',t:'Decode'}].forEach(l => {
          const s = scLeg.append('span').style('display','flex').style('align-items','center').style('gap','4px');
          s.append('span').style('width','8px').style('height','8px').style('background',l.c).style('border-radius','50%').style('display','inline-block');
          s.append('span').style('color','#8b949e').text(l.t);
        });

        // ── Input Length Filter ──
        const filterRow = scSec.append('div').style('margin','8px 0 2px').style('display','flex').style('align-items','center').style('gap','8px').style('font-size','11px');
        filterRow.append('span').style('color','#8b949e').text('Filter input tokens:');
        const inSt = 'width:64px;background:#161b22;border:1px solid #30363d;color:#c9d1d9;padding:3px 6px;border-radius:3px;font-size:11px;font-family:inherit';
        const minIn = filterRow.append('input').attr('type','number').attr('value',tokLo).attr('min',tokLo).attr('max',tokHi).attr('style',inSt);
        filterRow.append('span').style('color','#484f58').text('–');
        const maxIn = filterRow.append('input').attr('type','number').attr('value',tokHi).attr('min',tokLo).attr('max',tokHi).attr('style',inSt);
        filterRow.append('span').style('color','#484f58').text('tokens');
        const countLbl = filterRow.append('span').style('color','#58a6ff').style('margin-left','8px');
        countLbl.text(`Showing all ${reqs.length} requests`);
        const resetBtn = filterRow.append('button').text('Reset')
          .attr('style','background:#21262d;color:#8b949e;border:1px solid #30363d;padding:2px 8px;border-radius:3px;font-size:10px;cursor:pointer;display:none');

        function applyFilter() {
          const lo = +minIn.property('value'), hi = +maxIn.property('value');
          const filt = reqs.filter(r => { const t = r.input_tokens || 0; return t >= lo && t <= hi; });
          countLbl.text(`Showing ${filt.length} of ${reqs.length} requests`);
          resetBtn.style('display', (lo > tokLo || hi < tokHi) ? 'inline' : 'none');
          const inRange = d => { const t = d.input_tokens || 0; return t >= lo && t <= hi; };
          if (ttftDots) ttftDots.attr('fill-opacity', d => inRange(d) ? 0.75 : 0.08);
          if (decDots) decDots.attr('fill-opacity', d => inRange(d) ? 0.75 : 0.08);
          renderFiltered(filt);
        }
        minIn.on('input', applyFilter);
        maxIn.on('input', applyFilter);
        resetBtn.on('click', () => { minIn.property('value', tokLo); maxIn.property('value', tokHi); applyFilter(); });
      }

      // ── Filtered Content (Gantt + Metrics) ──
      const filtEl = el.append('div');

      function renderFiltered(rqs) {
        filtEl.html('');
        const COLORS = ['#58a6ff', '#f0883e', '#bc8cff', '#3fb950', '#f85149', '#d2a8ff', '#79c0ff', '#ffa657'];

        const ttfts = rqs.map(r => r.ttft_ms || 0);
        const medTtft = ttfts.slice().sort((a, b) => a - b)[Math.floor(ttfts.length / 2)];
        const maxEnd = Math.max(...rqs.map(r => (r.start_ms || 0) + (r.latency_ms || 0)), 1);

        // ── Request Timeline (Gantt) ──
        const timeline = filtEl.append('div').classed('wl-section', true);
        timeline.append('div').classed('wl-title', true).text('Request Timeline');

        const barW = 600, barH = 20;
        const tScale2 = barW / (maxEnd || 1);
        const TL_LIMIT = 10;
        let tlShowAll = rqs.length <= TL_LIMIT;
        const tlContainer = timeline.append('div');

        function renderTimeline() {
          tlContainer.html('');
          const visible = tlShowAll ? rqs : rqs.slice(0, TL_LIMIT);
          visible.forEach(req => renderTimelineRow(tlContainer, req));
          if (rqs.length > TL_LIMIT) {
            const hidden = rqs.length - TL_LIMIT;
            tlToggleBtn.html(tlShowAll ? `▼ Show first ${TL_LIMIT}` : `▶ Show all ${rqs.length} requests (${hidden} hidden)`);
          }
        }

        function renderTimelineRow(container, req) {
          const isHotspot = (req.ttft_ms || 0) > medTtft * 2;
          const row = container.append('div').classed('req-row', true).classed('hotspot', isHotspot);
          row.append('div').classed('req-label', true).text(req.label || 'Req');
          row.append('div').classed('req-tokens', true).text(`${req.input_tokens || 0} in / ${req.output_tokens || 0} out`);
          const startMs = req.start_ms || 0, ttftMs = req.ttft_ms || 0;
          const decodeMs = Math.max(0, (req.latency_ms || 0) - ttftMs);
          const svg = row.append('div').classed('req-bar-container', true).append('svg').attr('width', barW + 10).attr('height', barH);
          const x0 = startMs * tScale2, pW2 = Math.max(1, ttftMs * tScale2), dW = Math.max(1, decodeMs * tScale2);
          svg.append('rect').attr('x', x0).attr('y', 2).attr('width', pW2).attr('height', barH - 4).attr('fill', isHotspot ? '#f85149' : '#58a6ff').attr('fill-opacity', 0.7);
          svg.append('rect').attr('x', x0 + pW2).attr('y', 2).attr('width', dW).attr('height', barH - 4).attr('fill', '#2ea043').attr('fill-opacity', 0.6);
          row.append('div').classed('req-total', true).text(fmtMs(req.latency_ms || 0));
          if (isHotspot) row.append('div').classed('req-click-hint', true).text('HOTSPOT');
        }

        const tlToggleBtn = timeline.append('button')
          .attr('style', 'background:#21262d;color:#58a6ff;border:1px solid #30363d;padding:4px 12px;border-radius:4px;font-size:10px;cursor:pointer;margin:6px 0')
          .style('display', rqs.length > TL_LIMIT ? 'inline-flex' : 'none')
          .on('click', () => { tlShowAll = !tlShowAll; renderTimeline(); });
        renderTimeline();

        const axisSvg = timeline.append('svg').attr('width', barW + 190).attr('height', 20);
        const axG = axisSvg.append('g').attr('transform', `translate(186,0)`);
        const axScale = d3.scaleLinear().domain([0, maxEnd]).range([0, barW]);
        axG.call(d3.axisBottom(axScale).ticks(6).tickFormat(v => fmtMs(v))).selectAll('text').attr('fill', '#8b949e').attr('font-size', '8px');
        axG.selectAll('.domain,.tick line').attr('stroke', '#30363d');

        const legend = timeline.append('div').style('margin-top', '8px').style('display', 'flex').style('gap', '16px').style('font-size', '9px');
        function addLeg(color, label) { const l = legend.append('span').style('display', 'flex').style('align-items', 'center').style('gap', '4px'); l.append('span').style('width', '10px').style('height', '10px').style('background', color).style('border-radius', '2px').style('display', 'inline-block').style('opacity', '0.7'); l.append('span').style('color', '#8b949e').text(label); }
        addLeg('#484f58', 'Queue');
        addLeg('#58a6ff', 'TTFT (Prefill)');
        addLeg('#2ea043', 'Decode');
        addLeg('#f85149', 'Hotspot (>2x median TTFT)');

        // ── Summary Stats ──
        const sumSec = filtEl.append('div').classed('wl-section', true);
        sumSec.append('div').classed('wl-title', true).text('Summary');
        const sumRow = sumSec.append('div').style('display','flex').style('flex-wrap','wrap').style('gap','6px');
        function pct(arr, p) { const s = arr.slice().sort((a,b)=>a-b); const k = (s.length-1)*p/100; return s[Math.ceil(k)]; }
        [{label:'TTFT', key:'ttft_ms', c:'#58a6ff'}, {label:'Decode', key:'decode_ms', c:'#2ea043'}, {label:'Queue', key:'queue_ms', c:'#484f58'}, {label:'ITL', key:'itl_median_ms', c:'#f0883e'}, {label:'E2E', key:'latency_ms', c:'#bc8cff'}].forEach(m => {
          const vals = rqs.map(r => r[m.key] || 0);
          if (vals.every(v => v === 0)) return;
          const chip = sumRow.append('div').style('background','#161b22').style('border','1px solid #30363d').style('border-radius','6px').style('padding','6px 10px').style('font-size','10px').style('min-width','100px');
          chip.append('div').style('color', m.c).style('font-weight','600').style('margin-bottom','3px').text(m.label);
          chip.append('div').style('color','#8b949e').html(`p50 <span style="color:#c9d1d9">${fmtMs(pct(vals,50))}</span> · p99 <span style="color:#c9d1d9">${fmtMs(pct(vals,99))}</span>`);
          chip.append('div').style('color','#8b949e').html(`min <span style="color:#c9d1d9">${fmtMs(Math.min(...vals))}</span> · max <span style="color:#c9d1d9">${fmtMs(Math.max(...vals))}</span>`);
        });

        if (prom) {
          const promChip = sumRow.append('div').style('background','#161b22').style('border','1px solid #30363d').style('border-radius','6px').style('padding','6px 10px').style('font-size','10px');
          promChip.append('div').style('color','#d2a8ff').style('font-weight','600').style('margin-bottom','3px').text('Prometheus');
          if (prom.kv_cache_usage_pct != null) promChip.append('div').style('color','#8b949e').html(`KV Cache <span style="color:#c9d1d9">${(prom.kv_cache_usage_pct*100).toFixed(1)}%</span>`);
          if (prom.num_preemptions != null) promChip.append('div').style('color','#8b949e').html(`Preemptions <span style="color:#c9d1d9">${prom.num_preemptions}</span>`);
        }

        // ── Color-coded Sortable Table ──
        const tblSec = filtEl.append('div').classed('wl-section', true);
        tblSec.append('div').classed('wl-title', true).text('Per-Request Data');

        const cols = [
          {key:'label', label:'Request', numeric:false},
          {key:'input_tokens', label:'Input', numeric:true},
          {key:'output_tokens', label:'Output', numeric:true},
          {key:'ttft_ms', label:'TTFT', numeric:true, ms:true, color:true},
          {key:'decode_ms', label:'Decode', numeric:true, ms:true, color:true},
          {key:'queue_ms', label:'Queue', numeric:true, ms:true, color:true},
          {key:'itl_median_ms', label:'ITL', numeric:true, ms:true, color:true},
          {key:'latency_ms', label:'Latency', numeric:true, ms:true, color:true},
        ];
        if (rqs.some(r => r.kernel_count)) cols.push({key:'kernel_count', label:'Kernels', numeric:true, color:false});
        if (rqs.some(r => r.kernel_time_ms)) cols.push({key:'kernel_time_ms', label:'GPU Time', numeric:true, ms:true, color:true});

        const colStats = {};
        cols.forEach(col => {
          if (!col.color) return;
          const vals = rqs.map(r => r[col.key] || 0).sort((a,b) => a - b);
          colStats[col.key] = { p25: vals[Math.floor(vals.length * 0.25)], p75: vals[Math.floor(vals.length * 0.75)] };
        });

        function cellBg(col, val) {
          if (!col.color || !colStats[col.key]) return 'transparent';
          const s = colStats[col.key];
          if (val <= s.p25) return 'rgba(46, 160, 67, 0.25)';
          if (val >= s.p75) return 'rgba(248, 81, 73, 0.25)';
          return 'transparent';
        }

        const tblStyle = 'width:100%;border-collapse:collapse;font-size:10px;font-family:inherit';
        const thStyle = 'padding:4px 6px;text-align:right;color:#8b949e;border-bottom:1px solid #30363d;cursor:pointer;user-select:none;white-space:nowrap';
        const tdStyle = 'padding:3px 6px;text-align:right;color:#c9d1d9;border-bottom:1px solid #21262d;white-space:nowrap';

        const table = tblSec.append('table').attr('style', tblStyle);
        const thead = table.append('thead');
        const hRow = thead.append('tr');
        cols.forEach(col => {
          hRow.append('th').attr('style', thStyle + (col.numeric ? '' : ';text-align:left'))
            .text(col.label)
            .on('click', () => doSort(col.key));
        });

        let sortKey = 'latency_ms', sortAsc = false;
        const SHOW_LIMIT = 20;
        let showAll = rqs.length <= SHOW_LIMIT;
        const tbody = table.append('tbody');

        function renderTable() {
          const sorted = [...rqs].sort((a, b) => {
            let av = a[sortKey], bv = b[sortKey];
            if (typeof av === 'string') return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
            av = av || 0; bv = bv || 0;
            return sortAsc ? av - bv : bv - av;
          });
          const visible = showAll ? sorted : sorted.slice(0, SHOW_LIMIT);
          tbody.selectAll('tr').remove();
          visible.forEach(r => {
            const tr = tbody.append('tr')
              .on('mouseover', function() { d3.select(this).style('background', '#1c2128'); })
              .on('mouseout', function() { d3.select(this).style('background', 'transparent'); });
            cols.forEach(col => {
              const val = r[col.key] || 0;
              const display = col.ms ? fmtMs(val) : (col.numeric ? val.toLocaleString() : val);
              tr.append('td').attr('style', tdStyle + (col.numeric ? '' : ';text-align:left'))
                .style('background', cellBg(col, val))
                .text(display);
            });
          });
          expandBtn.style('display', rqs.length > SHOW_LIMIT ? 'inline-flex' : 'none')
            .html(showAll ? `▼ Show top ${SHOW_LIMIT}` : `▶ Show all ${rqs.length} requests`);
        }

        function doSort(key) {
          if (sortKey === key) sortAsc = !sortAsc;
          else { sortKey = key; sortAsc = key === 'label'; }
          hRow.selectAll('th').each(function(_, i) {
            const th = d3.select(this);
            const arrow = cols[i].key === sortKey ? (sortAsc ? ' ▲' : ' ▼') : '';
            th.text(cols[i].label + arrow);
          });
          renderTable();
        }

        const btnRow = tblSec.append('div').style('display','flex').style('gap','8px').style('margin-top','8px');
        const expandBtn = btnRow.append('button').html(`▶ Show all ${rqs.length} requests`)
          .attr('style', 'background:#21262d;color:#58a6ff;border:1px solid #30363d;padding:4px 12px;border-radius:4px;font-size:10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px')
          .on('click', () => { showAll = !showAll; renderTable(); });

        doSort('latency_ms');

        // ── Download CSV ──
        const dlBtn = btnRow.append('button').text('Download CSV')
          .attr('style', 'background:#21262d;color:#8b949e;border:1px solid #30363d;padding:4px 12px;border-radius:4px;font-size:10px;cursor:pointer');
        dlBtn.on('click', () => {
          const header = cols.map(c => c.label).join(',');
          const rows = rqs.map(r => cols.map(c => r[c.key] || 0).join(','));
          const csv = [header, ...rows].join('\n');
          const blob = new Blob([csv], {type: 'text/csv'});
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'workload_requests.csv'; a.click();
        });
      }

      renderFiltered(reqs);
    }

    // ═══ Tab 2: Profiler ═══
    const REQ_COLORS = ['#58a6ff', '#f0883e', '#bc8cff', '#3fb950', '#f85149', '#d2a8ff', '#79c0ff', '#ffa657'];

    function vProfiler(reqIdx) {
      const el = d3.select('#inspector-view').html('');
      const hasP = P && P.merged_tree;
      if (!hasP) { el.append('div').text('No profile data. Run profile_serve.py then profiler_to_diagram.py --per-request-dir.'); return; }

      if (reqIdx < 0 || reqIdx >= P.count) reqIdx = 0;
      inspectReqIdx = reqIdx;

      // ═══ Per-Request Module Tree (from profile_serve.py) ═══
      const labels = P.request_labels || [];
      const n = labels.length;
      const tree = P.merged_tree;

      el.append('div').classed('wl-title', true)
        .text('Hierarchical Call Tree (per-request timing)');
      const profMode = (P.mode || 'eager').charAt(0).toUpperCase() + (P.mode || 'eager').slice(1);
      const modeColor = P.mode === 'compiled' ? '#58a6ff' : '#f0883e';
      el.append('div').style('font-size', '10px').style('color', '#8b949e').style('margin-bottom', '8px')
        .html(`Mode: <span style="color:${modeColor};font-weight:bold">${profMode}</span>`
            + (P.mode === 'compiled' ? ' — compiled execution flattens nn.Module hierarchy.' : ' — full nn.Module hierarchy.'));

      // Request selector
      const sel = el.append('div').classed('req-sel', true);
      labels.forEach((l, i) => {
        sel.append('button').classed('req-sel-btn', true).classed('active', i === inspectReqIdx)
          .style('color', REQ_COLORS[i % REQ_COLORS.length])
          .style('border-color', i === inspectReqIdx ? REQ_COLORS[i % REQ_COLORS.length] : '#30363d')
          .text(l)
          .on('click', () => { inspectReqIdx = i; vProfiler(i); });
      });

      // Column header
      const hdr = el.append('div').classed('mt-header', true);
      hdr.append('span').classed('mt-cls', true).text('Module / Op');
      labels.forEach((l, i) => {
        hdr.append('span').classed('mt-val', true)
          .style('color', REQ_COLORS[i % REQ_COLORS.length])
          .style('font-weight', i === inspectReqIdx ? 'bold' : 'normal')
          .text(l);
      });
      hdr.append('span').classed('mt-pct', true).text('% parent');

      // Split layout: tree on left, layer variance chart on right
      const splitDiv = el.append('div').classed('mt-split', true).style('margin-top', '4px');
      const treeEl = splitDiv.append('div').classed('mt-tree-col', true);
      const chartCol = splitDiv.append('div').classed('mt-chart-col', true)
        .style('display', 'none');
      chartCol.append('div').classed('mt-chart-title', true);
      chartCol.append('div').classed('mt-chart-subtitle', true);
      chartCol.append('div').classed('mt-chart-bars', true);

      // Layer variance chart updater
      window._layerChartCol = chartCol;
      window._layerChartReqIdx = inspectReqIdx;
      window._layerChartLabels = labels;

      mtRenderNode(treeEl, tree, 0, null, labels, 0);

      // Per-layer heatmap (if collapsed layers exist)
      mtRenderHeatmaps(el, tree, labels);

      // Architecture link
      if (M && M.module_tree) {
        el.append('div').style('margin-top', '12px')
          .append('span').classed('insp-back', true).text('Explore full model Architecture  >')
          .on('click', () => switchTab('arch'));
      }
    }

    // ── Layer variance chart (multi-request line chart) ──
    function showLayerChart(name, allLayerDurs, perReqAllLayerDurs) {
      const col = window._layerChartCol;
      if (!col) return;
      col.style('display', 'block');
      col.select('.mt-chart-title').text(`Layer Variance — ${name}`);

      const reqIdx = window._layerChartReqIdx || 0;
      const labels = window._layerChartLabels || [];

      // Build array of per-request layer durs: [[req0 layers], [req1 layers], ...]
      let allReqDurs = [];
      if (perReqAllLayerDurs && perReqAllLayerDurs.length) {
        allReqDurs = perReqAllLayerDurs.filter(d => d && d.length);
      }
      if (!allReqDurs.length && allLayerDurs && allLayerDurs.length) {
        allReqDurs = [allLayerDurs];
      }

      const barsDiv = col.select('.mt-chart-bars');
      barsDiv.html('');

      if (!allReqDurs.length || !allReqDurs[0].length) {
        col.select('.mt-chart-subtitle').text('No per-layer data');
        return;
      }

      const nLayers = allReqDurs[0].length;
      const nReqs = allReqDurs.length;
      const allFlat = allReqDurs.flat();
      const globalMax = Math.max(...allFlat);
      const globalMin = Math.min(...allFlat);

      // Stats for selected request
      const selDurs = allReqDurs[reqIdx] || allReqDurs[0];
      const selAvg = selDurs.reduce((s, d) => s + d, 0) / selDurs.length;
      col.select('.mt-chart-subtitle').text(`${nLayers} layers × ${nReqs} req | avg: ${fmtUs(selAvg)} | range: ${fmtUs(globalMin)}–${fmtUs(globalMax)}`);

      // Chart dimensions
      const pad = { t: 12, r: 8, b: 28, l: 44 };
      const chartW = 260, chartH = 140;
      const innerW = chartW - pad.l - pad.r, innerH = chartH - pad.t - pad.b;
      const svg = barsDiv.append('svg').attr('width', chartW).attr('height', chartH);
      const g = svg.append('g').attr('transform', `translate(${pad.l},${pad.t})`);

      const xScale = d3.scaleLinear().domain([0, nLayers - 1]).range([0, innerW]);
      const yScale = d3.scaleLinear().domain([0, globalMax * 1.1]).range([innerH, 0]);

      // Axes
      g.append('g').attr('transform', `translate(0,${innerH})`).call(d3.axisBottom(xScale).ticks(Math.min(8, nLayers)).tickFormat(d => `L${d}`))
        .selectAll('text').attr('fill', '#8b949e').attr('font-size', '7px');
      g.selectAll('.domain,.tick line').attr('stroke', '#30363d');
      g.append('g').call(d3.axisLeft(yScale).ticks(4).tickFormat(v => fmtUs(v)))
        .selectAll('text').attr('fill', '#8b949e').attr('font-size', '7px');

      // Avg dashed line for selected request
      g.append('line').attr('x1', 0).attr('x2', innerW).attr('y1', yScale(selAvg)).attr('y2', yScale(selAvg))
        .attr('stroke', '#484f58').attr('stroke-width', 1).attr('stroke-dasharray', '3,2');
      g.append('text').attr('x', innerW).attr('y', yScale(selAvg) - 3).attr('text-anchor', 'end')
        .attr('fill', '#484f58').attr('font-size', '7px').text('avg');

      // One line per request
      const line = d3.line().x((_, i) => xScale(i)).y(d => yScale(d));

      allReqDurs.forEach((reqDurs, ri) => {
        const color = REQ_COLORS[ri % REQ_COLORS.length];
        const isSelected = ri === reqIdx;
        g.append('path').datum(reqDurs).attr('d', line)
          .attr('fill', 'none').attr('stroke', color)
          .attr('stroke-width', isSelected ? 2 : 1)
          .attr('stroke-opacity', isSelected ? 1 : 0.4);
      });

      // Dots + hover for selected request
      selDurs.forEach((d, i) => {
        const cx = xScale(i), cy = yScale(d);
        const pctOfAvg = selAvg > 0 ? d / selAvg : 1;
        const dotColor = pctOfAvg > 1.5 ? '#f85149' : pctOfAvg > 1.15 ? '#f0883e' : REQ_COLORS[reqIdx % REQ_COLORS.length];
        const dot = g.append('circle').attr('cx', cx).attr('cy', cy).attr('r', 2.5)
          .attr('fill', dotColor).attr('stroke', 'none');
        dot.on('mouseover', function (evt) {
          d3.select(this).attr('r', 5);
          const vals = allReqDurs.map((rd, ri) => `${labels[ri] || 'R' + (ri + 1)}: ${fmtUs(rd[i])}`).join(' | ');
          tip(evt, `<div class="ftitle">Layer ${i}</div><div style="color:#c9d1d9;font-size:9px">${vals}</div>`);
        })
          .on('mousemove', evt => d3.select('#tip').style('left', (evt.clientX + 12) + 'px').style('top', (evt.clientY - 10) + 'px'))
          .on('mouseout', function () { d3.select(this).attr('r', 2.5); tipHide(); });
      });

      // Legend
      const legend = barsDiv.append('div').style('display', 'flex').style('gap', '8px').style('margin-top', '6px').style('flex-wrap', 'wrap');
      allReqDurs.forEach((_, ri) => {
        const color = REQ_COLORS[ri % REQ_COLORS.length];
        const isSelected = ri === reqIdx;
        const item = legend.append('span').style('font-size', '8px').style('color', color)
          .style('opacity', isSelected ? '1' : '0.5')
          .text(`● ${labels[ri] || 'R' + (ri + 1)}`);
      });

      d3.selectAll('.chart-selected').classed('chart-selected', false);
    }

    // ── Merged tree rendering helpers ──
    function mtRenderNode(container, node, depth, parentDurs, labels, startOpen) {
      const nodeDiv = container.append('div').classed('mt-node', true);
      const durs = node.per_request_dur_us || [node.dur_us || 0];
      const n = labels.length;
      const hasKids = (node.children && node.children.length) || (node.ops && node.ops.length);
      const maxDur = Math.max(...durs);

      const row = nodeDiv.append('div').classed('mt-row', true)
        .style('padding-left', depth * 16 + 'px');

      const toggle = row.append('span').classed('mt-toggle', true).text(hasKids ? (depth < startOpen ? '▼' : '▶') : ' ');

      let clsText = node.class || '';
      if (node.repeat) clsText += ' ×' + node.repeat;
      row.append('span').classed('mt-cls', true).text(clsText);

      // Per-request duration values
      durs.forEach((d, i) => {
        const pctOfParent = parentDurs && parentDurs[i] ? (d / parentDurs[i] * 100) : 100;
        const isSelected = i === inspectReqIdx;
        const isMax = d === maxDur && n > 1;
        const color = REQ_COLORS[i % REQ_COLORS.length];
        row.append('span').classed('mt-val', true).classed('selected', isSelected)
          .style('color', color)
          .style('opacity', isSelected ? '1' : '0.5')
          .text(fmtUs(d));
      });

      // % of parent for selected request
      if (parentDurs && parentDurs[inspectReqIdx]) {
        const pct = (durs[inspectReqIdx] / parentDurs[inspectReqIdx] * 100);
        const pctColor = pct > 50 ? '#f85149' : pct > 20 ? '#f0883e' : '#484f58';
        row.append('span').classed('mt-pct', true).style('color', pctColor).text(pct.toFixed(1) + '%');
      }

      if (hasKids) {
        const childDiv = nodeDiv.append('div').classed('mt-children', true)
          .style('display', depth < startOpen ? 'block' : 'none');

        let expanded = depth < startOpen;
        let rendered = expanded;

        if (expanded) mtRenderChildren(childDiv, node, depth + 1, durs, labels, startOpen);

        row.on('click', () => {
          expanded = !expanded;
          toggle.text(expanded ? '▼' : '▶');
          childDiv.style('display', expanded ? 'block' : 'none');
          if (expanded && !rendered) {
            mtRenderChildren(childDiv, node, depth + 1, durs, labels, startOpen);
            rendered = true;
          }
          const prl = node.per_request_all_layer_durs || node.per_request_per_layer_dur;
          if (node.all_layer_durs || prl) {
            d3.selectAll('.chart-selected').classed('chart-selected', false);
            row.classed('chart-selected', true);
            showLayerChart(node.class || '', node.all_layer_durs, prl);
          }
        });
      } else if (node.all_layer_durs || node.per_request_all_layer_durs || node.per_request_per_layer_dur) {
        row.on('click', () => {
          d3.selectAll('.chart-selected').classed('chart-selected', false);
          row.classed('chart-selected', true);
          showLayerChart(node.class || '', node.all_layer_durs, node.per_request_all_layer_durs || node.per_request_per_layer_dur);
        });
      }
    }

    function mtRenderChildren(container, node, depth, parentDurs, labels, startOpen) {
      const children = node.children || [];
      const ops = node.ops || [];

      // Interleave children and ops by seq order
      const items = [];
      ops.forEach(op => items.push({ type: 'op', seq: op.seq ?? 9999, data: op }));
      children.forEach(ch => items.push({ type: 'mod', seq: ch.seq ?? 9999, data: ch }));
      items.sort((a, b) => a.seq - b.seq);

      items.forEach(item => {
        if (item.type === 'mod') {
          mtRenderNode(container, item.data, depth, parentDurs, labels, startOpen);
        } else {
          mtRenderOp(container, item.data, depth, parentDurs, labels);
        }
      });

      // Per-layer drill-down: if this node has individual layers stored
      if (node.layers && node.layers.length > 1) {
        const layerSection = container.append('div').classed('mt-node', true)
          .style('margin-top', '4px').style('border-top', '1px solid #21262d').style('padding-top', '4px');
        const layerRow = layerSection.append('div').classed('mt-row', true)
          .style('padding-left', depth * 16 + 'px');
        const layerToggle = layerRow.append('span').classed('mt-toggle', true).text('▶');
        layerRow.append('span').classed('mt-cls', true)
          .style('color', '#8b949e').style('font-style', 'italic')
          .text(`Individual layers (0–${node.layers.length - 1})`);
        const layerContainer = layerSection.append('div').classed('mt-children', true)
          .style('display', 'none');
        let layerRendered = false;
        layerRow.on('click', (evt) => {
          evt.stopPropagation();
          const show = layerContainer.style('display') === 'none';
          layerToggle.text(show ? '▼' : '▶');
          layerContainer.style('display', show ? 'block' : 'none');
          if (show && !layerRendered) {
            node.layers.forEach((layer, li) => {
              const lNode = Object.assign({}, layer, { class: `Layer ${li} — ${layer.class}` });
              mtRenderNode(layerContainer, lNode, depth, parentDurs, labels, 0);
            });
            layerRendered = true;
          }
        });
      }
    }

    function mtRenderOp(container, op, depth, parentDurs, labels) {
      const durs = op.per_request_dur_us || [op.dur_us || 0];
      const gpuDurs = op.per_request_gpu_dur_us;
      const n = labels.length;

      const row = container.append('div').classed('mt-op', true)
        .style('padding-left', (depth * 16 + 14) + 'px');

      row.append('span').classed('mt-op-name', true).text(op.op)
        .attr('title', op.op);

      // Show kernel: direct, or from sub_ops chain
      let gpuName = op.gpu, gpuNote = op.gpu_note;
      if (!gpuName && op.sub_ops) {
        const findK = (subs) => { for (const s of subs) { if (s.gpu) return s.gpu; if (s.sub_ops) { const r = findK(s.sub_ops); if (r) return r; } } return null; };
        gpuName = findK(op.sub_ops);
      }
      if (gpuName) {
        const short = gpuName.length > 40 ? gpuName.slice(0, 37) + '...' : gpuName;
        row.append('span').classed('mt-op-gpu', true).text(short).attr('title', gpuName);
      } else if (gpuNote) {
        row.append('span').classed('mt-op-gpu', true).style('color', '#484f58').text(gpuNote);
      }

      // Per-request values (show GPU dur if available, else CPU dur)
      const showDurs = gpuDurs || durs;
      showDurs.forEach((d, i) => {
        const isSelected = i === inspectReqIdx;
        const color = gpuDurs ? '#f0883e' : '#8b949e';
        row.append('span').classed('mt-val', true).classed('selected', isSelected)
          .style('color', color)
          .style('opacity', isSelected ? '1' : '0.5')
          .style('font-size', '9px')
          .text(fmtUs(d));
      });

      // % of parent for selected
      if (parentDurs && parentDurs[inspectReqIdx]) {
        const d = showDurs[inspectReqIdx] || 0;
        const pct = d / parentDurs[inspectReqIdx] * 100;
        if (pct > 0.1) {
          row.append('span').classed('mt-pct', true)
            .style('color', pct > 50 ? '#f85149' : pct > 20 ? '#f0883e' : '#484f58')
            .text(pct.toFixed(1) + '%');
        }
      }

      // Click op to show layer variance chart
      if (op.all_layer_durs || op.per_request_all_layer_durs) {
        row.style('cursor', 'pointer').on('click', () => {
          d3.selectAll('.chart-selected').classed('chart-selected', false);
          row.classed('chart-selected', true);
          showLayerChart(op.op || '', op.all_layer_durs, op.per_request_all_layer_durs);
        });
      }
    }

    function mtRenderHeatmaps(el, tree, labels) {
      // Find collapsed layer nodes with per_request_per_layer_dur
      function findCollapsed(node) {
        if (node.per_request_per_layer_dur && node.repeat) return [node];
        let found = [];
        (node.children || []).forEach(ch => { found = found.concat(findCollapsed(ch)); });
        return found;
      }
      const collapsed = findCollapsed(tree);
      if (!collapsed.length) return;

      collapsed.forEach(node => {
        const prl = node.per_request_per_layer_dur;
        if (!prl || !prl.length) return;
        const numLayers = prl[0].length;
        if (!numLayers) return;

        const sec = el.append('div').classed('wl-section', true).style('margin-top', '20px');
        sec.append('div').classed('wl-title', true).text(`Per-Layer Heatmap — ${node.class} ×${node.repeat}`);

        // Find global max across all requests and layers
        let globalMax = 0;
        prl.forEach(layers => layers.forEach(d => { if (d > globalMax) globalMax = d; }));
        if (!globalMax) return;

        const hmContainer = sec.append('div').classed('heatmap-container', true);

        // Layer column headers
        const hdrRow = hmContainer.append('div').style('display', 'flex').style('align-items', 'center').style('margin-bottom', '2px');
        hdrRow.append('span').style('width', '160px').style('flex-shrink', '0').style('font-size', '8px').style('color', '#484f58').text('');
        for (let l = 0; l < numLayers; l++) {
          hdrRow.append('span').style('width', '16px').style('text-align', 'center').style('font-size', '7px').style('color', '#484f58').text(l);
        }

        // One row per request
        prl.forEach((layers, ri) => {
          const row = hmContainer.append('div').style('display', 'flex').style('align-items', 'center').style('margin-bottom', '1px');
          row.append('span').style('width', '160px').style('flex-shrink', '0').style('font-size', '9px').style('font-weight', 'bold')
            .style('color', REQ_COLORS[ri % REQ_COLORS.length]).text(labels[ri]);

          const avgDur = layers.reduce((s, d) => s + d, 0) / layers.length;
          layers.forEach((d, li) => {
            const intensity = d / globalMax;
            const ratio = avgDur > 0 ? d / avgDur : 1;
            let bg;
            if (ratio > 1.5) bg = `rgba(248,81,73,${Math.min(0.9, intensity + 0.2)})`;
            else if (ratio > 1.1) bg = `rgba(240,136,62,${Math.min(0.8, intensity + 0.15)})`;
            else if (ratio < 0.7) bg = `rgba(63,185,80,${Math.min(0.6, intensity + 0.1)})`;
            else bg = `rgba(88,166,255,${Math.min(0.7, intensity + 0.1)})`;

            row.append('span').classed('heatmap-cell', true)
              .style('background', bg)
              .attr('title', `${labels[ri]} L${li}: ${fmtUs(d)} (${ratio > 1 ? '+' : ''}${((ratio - 1) * 100).toFixed(0)}% vs avg)`);
          });

          // Total for this request
          const total = layers.reduce((s, d) => s + d, 0);
          row.append('span').style('font-size', '8px').style('color', '#8b949e').style('margin-left', '8px').text(fmtUs(total));
        });

        sec.append('div').style('font-size', '8px').style('color', '#484f58').style('margin-top', '4px')
          .text('Cell color: red = >1.5x layer avg, orange = >1.1x, green = <0.7x. Hover for values.');
      });
    }

    // ═══ Tab 3: Architecture Graph (existing code, untouched) ═══
    function nav(id, data) { stk.push({ id, data }); render(); }
    function back(i) { stk = stk.slice(0, i + 1); render(); }

    function render() {
      const bc = d3.select('#bc').html('');
      stk.forEach((v, i) => {
        if (i) bc.append('span').classed('s', true).text(' › ');
        let nm = NM[v.id] || v.id;
        if (v.id === 'layer' && v.data != null) nm = `Layer ${v.data}`;
        if (v.id === 'step' && v.data) nm = v.data.label || v.data.role;
        if (v.id === 'mod' && v.data) nm = v.data.class + (v.data.repeat ? ` ×${v.data.repeat}` : '');
        const s = bc.append('span').text(nm);
        if (i < stk.length - 1) s.on('click', () => back(i));
        else s.classed('c', true);
      });
      const cur = stk[stk.length - 1];
      if (cur.id === 'top') vTop();
      else if (cur.id === 'layer') vLayer(cur.data);
      else if (cur.id === 'step') vStep(cur.data);
      else if (cur.id === 'post') vPost();
      else if (cur.id === 'pre') vPre();
      else if (cur.id === 'mod') vMod(cur.data);
    }

    function mkG() {
      const svg = d3.select('#svg').html('');
      const g = svg.append('g');
      svg.call(d3.zoom().scaleExtent([0.1, 6]).on('zoom', e => g.attr('transform', e.transform)));
      return g;
    }

    function tip(evt, html) {
      const t = d3.select('#tip');
      t.html(html).style('display', 'block')
        .style('left', (evt.clientX + 12) + 'px').style('top', (evt.clientY - 10) + 'px');
    }
    function tipHide() { d3.select('#tip').style('display', 'none'); }

    function fmtUs(us) {
      if (us >= 1000) return (us / 1000).toFixed(1) + 'ms';
      return us.toFixed(1) + 'μs';
    }

    function fmtShape(s) { return '[' + s.join(', ') + ']'; }

    function durColor(dur, avg) {
      const ratio = dur / avg;
      if (ratio <= 0.85) return '#2ea043';
      if (ratio <= 1.0) return '#3fb950';
      if (ratio <= 1.15) return '#d29922';
      if (ratio <= 1.4) return '#e3b341';
      return '#f85149';
    }

    function layerBars(g, durs, { x = 0, y0 = 18, barW = 160, onClick = null, title = 'Per-Layer Duration' } = {}) {
      g.append('text').attr('fill', '#58a6ff').attr('font-size', '11px').attr('font-weight', 'bold').text(title);
      const avg = durs.reduce((s, d) => s + d, 0) / durs.length;
      const maxDur = Math.max(...durs);
      durs.forEach((d, i) => {
        const y = y0 + i * 13;
        const bw = Math.max(2, barW * d / maxDur);
        const col = durColor(d, avg);
        const bar = g.append('rect').attr('x', x).attr('y', y).attr('width', bw).attr('height', 10)
          .attr('rx', 2).attr('fill', col).attr('fill-opacity', 0.3).attr('stroke', col).attr('stroke-width', 1);
        if (onClick) {
          bar.style('cursor', 'pointer')
            .on('click', () => onClick(i))
            .on('mouseover', function (evt) {
              d3.select(this).attr('stroke-width', 2).attr('fill-opacity', 0.5);
              const pct = (((d - avg) / avg) * 100).toFixed(1);
              tip(evt, `<b>Layer ${i}</b><br>${fmtUs(d)}<br>vs avg: ${pct >= 0 ? '+' : ''}${pct}%`);
            })
            .on('mousemove', function (evt) { d3.select('#tip').style('left', (evt.clientX + 12) + 'px').style('top', (evt.clientY - 10) + 'px'); })
            .on('mouseout', function () { d3.select(this).attr('stroke-width', 1).attr('fill-opacity', 0.3); tipHide(); });
        }
        g.append('text').attr('x', x + bw + 4).attr('y', y + 9).attr('fill', '#8b949e').attr('font-size', '8px')
          .text(`L${i}: ${fmtUs(d)}`);
      });
      return y0 + durs.length * 13;
    }

    function flowTip(opData) {
      if (!opData || !opData.args) return '';
      const args = opData.args;
      const gpu = opData.gpu_display || opData.gpu || '';
      const dur = opData.gpu_dur_us || opData.dur_us;
      const opLabel = opData.label || opData.op;

      let h = `<div class="ftitle">${opLabel}</div>`;
      h += `<div class="frow">`;

      h += `<div class="finputs">`;
      args.forEach(a => {
        h += `<div class="fbox">`;
        h += `<span class="fname">${a.name}</span>`;
        h += `<span class="fdim">${fmtShape(a.shape)}</span>`;
        if (a.dtype) h += `<span class="ftype">${a.dtype}</span>`;
        h += `</div>`;
      });
      h += `</div>`;

      h += `<span class="farr">──▶</span>`;

      h += `<div class="fbox op">`;
      h += `<span class="foplabel">${opLabel}</span>`;
      if (gpu) h += `<span class="fopgpu">${gpu}</span>`;
      h += `<span class="foptime">${fmtUs(dur)}</span>`;
      h += `</div>`;

      h += `</div>`;

      const subs = opData.sub_ops;
      if (subs && subs.length) {
        h += `<div style="margin-top:8px;border-top:1px solid #30363d;padding-top:6px">`;
        h += `<span style="color:#58a6ff;font-size:9px;font-weight:bold">CPU → GPU Dispatch</span>`;
        function subLine(sub, depth) {
          const pre = depth ? '└ ' : '';
          const indent = depth * 12;
          const gpuStr = sub.gpu_display
            ? `<span style="color:#f0883e">${sub.gpu_display} (${fmtUs(sub.gpu_dur_us)})</span>`
            : `<span style="color:#484f58">${sub.gpu_note || 'CPU-only'}</span>`;
          const dimsStr = sub.dims ? ` <span style="color:#8b949e">${sub.dims}</span>` : '';
          const fs = depth ? 8 : 9;
          h += `<div style="margin:${depth ? 1 : 2}px 0 ${depth ? 1 : 2}px ${indent}px;font-size:${fs}px"><span style="color:#7ee787">${pre}${sub.op}</span>${dimsStr} <span style="color:#8b949e">${fmtUs(sub.dur_us)}</span> → ${gpuStr}</div>`;
          if (sub.sub_ops) sub.sub_ops.forEach(gs => subLine(gs, depth + 1));
        }
        subs.forEach(sub => subLine(sub, 0));
        h += `</div>`;
      }

      return h;
    }

    function buildModTooltip(child) {
      const dur = child.avg_dur_us || child.dur_us || 0;
      const cOps = child.ops || [];
      const cChildren = child.children || [];
      let h = `<div class="ftitle">${child.class}</div>`;
      h += `<div style="margin-bottom:6px;color:#8b949e;font-size:9px">${fmtUs(dur)} | ${cChildren.length} modules | ${cOps.length} ops</div>`;
      cChildren.forEach(cc => {
        const ccDur = cc.avg_dur_us || cc.dur_us || 0;
        h += `<div style="margin:2px 0;font-size:9px"><span style="color:#bc8cff">${cc.class}</span>: ${fmtUs(ccDur)}</div>`;
      });
      cOps.forEach(op => {
        const gpuStr = op.gpu ? ` &rarr; <span style="color:#f0883e">${op.gpu}</span>` : (op.gpu_note ? ` <span style="color:#484f58">${op.gpu_note}</span>` : '');
        h += `<div style="margin:2px 0;font-size:9px"><span style="color:#7ee787">${op.op}</span> ${fmtUs(op.avg_us || op.dur_us)}${gpuStr}</div>`;
      });
      if (child.all_layer_durs)
        h += `<div style="margin-top:4px;border-top:1px solid #30363d;padding-top:4px;font-size:9px;color:#8b949e">avg: ${fmtUs(child.avg_dur_us)} | min: ${fmtUs(child.min_dur_us)} | max: ${fmtUs(child.max_dur_us)}</div>`;
      return h;
    }

    function renderModContent(g, mod, x, startY, w) {
      const children = mod.children || [];
      const ops = mod.ops || [];
      const items = [];
      ops.forEach(op => items.push({ type: 'op', seq: op.seq ?? 9999, data: op }));
      children.forEach(ch => items.push({ type: 'mod', seq: ch.seq ?? 9999, data: ch }));
      items.sort((a, b) => a.seq - b.seq);
      if (!items.length) return startY;
      let y = startY, prevBottom = null, prevItem = null;
      items.forEach(item => {
        if (prevBottom !== null) {
          const mx = x + w / 2;
          g.append('line').attr('x1', mx).attr('y1', prevBottom).attr('x2', mx).attr('y2', y)
            .attr('stroke', '#30363d').attr('stroke-width', 1.5);
          g.append('polygon').attr('points', `${mx},${y} ${mx - 4},${y - 6} ${mx + 4},${y - 6}`)
            .attr('fill', '#30363d');
          if (prevItem && prevItem.data && prevItem.data.dims)
            g.append('text').attr('x', mx + 8).attr('y', (prevBottom + y) / 2 + 3)
              .attr('fill', '#58a6ff').attr('font-size', '8px').text(prevItem.data.dims);
        }
        let h;
        if (item.type === 'op') h = drawOpBlock(g, item.data, x, y, w);
        else h = drawModBlock(g, item.data, x, y, w);
        prevBottom = y + h;
        prevItem = item;
        y += h + 14;
      });
      return y;
    }

    function drawOpBlock(g, op, x, y, w) {
      const hasGpu = !!op.gpu;
      const gpuLine = hasGpu ? `GPU: ${op.gpu} (${fmtUs(op.gpu_dur_us)})` : (op.gpu_note || '');
      const argsStr = (op.args || []).map(a => `${a.name}${fmtShape(a.shape)}`).join(', ');
      const statsStr = op.avg_us ? `avg: ${fmtUs(op.avg_us)} | min: ${fmtUs(op.min_us)} | max: ${fmtUs(op.max_us)}` : '';
      let nl = 1;
      if (gpuLine) nl++;
      if (argsStr) nl++;
      if (op.gpu_note && !hasGpu) nl++;
      if (statsStr) nl++;
      const H = Math.max(28, 4 + nl * 14);
      const cl = hasGpu ? rc(op.gpu_role || 'other') : C.tensor;
      const ng = g.append('g').attr('transform', `translate(${x},${y})`);
      ng.append('rect').attr('width', w).attr('height', H).attr('rx', 6)
        .attr('fill', cl.f).attr('stroke', cl.s).attr('stroke-width', 1.5);
      let ty = 14;
      ng.append('text').attr('x', 10).attr('y', ty).attr('fill', '#e6edf3').attr('font-size', '11px').attr('font-weight', 'bold').text(op.op);
      const durStr = fmtUs(op.avg_us || op.dur_us);
      const bw = Math.max(durStr.length * 6 + 14, 40);
      ng.append('rect').attr('x', w - bw - 8).attr('y', 3).attr('width', bw).attr('height', 15).attr('rx', 7).attr('fill', cl.s);
      ng.append('text').attr('x', w - bw).attr('y', 13).attr('fill', '#fff').attr('font-size', '8px').attr('font-weight', 'bold').text(durStr);
      if (gpuLine) { ty += 13; ng.append('text').attr('x', 10).attr('y', ty).attr('fill', '#8b949e').attr('font-size', '9px').text(gpuLine); }
      if (argsStr) { ty += 12; ng.append('text').attr('x', 12).attr('y', ty).attr('fill', '#c9d1d9').attr('font-size', '9px').text(argsStr); }
      if (op.gpu_note && !hasGpu) { ty += 12; ng.append('text').attr('x', 12).attr('y', ty).attr('fill', '#484f58').attr('font-size', '9px').text(op.gpu_note); }
      if (statsStr) { ty += 12; ng.append('text').attr('x', 12).attr('y', ty).attr('fill', '#8b949e').attr('font-size', '9px').text(statsStr); }
      ng.on('mouseover', function (evt) {
        d3.select(this).select('rect').attr('stroke-width', 2.5);
        let h = flowTip(op);
        if (!h) { h = `<div class="ftitle">${op.op}</div><div style="color:#8b949e;font-size:9px">${fmtUs(op.avg_us || op.dur_us)}</div>`; if (op.gpu) h += `<div style="color:#f0883e;font-size:9px">GPU: ${op.gpu}</div>`; if (op.gpu_note) h += `<div style="color:#484f58;font-size:9px">${op.gpu_note}</div>`; }
        tip(evt, h);
      })
        .on('mousemove', evt => d3.select('#tip').style('left', (evt.clientX + 12) + 'px').style('top', (evt.clientY - 10) + 'px'))
        .on('mouseout', function () { d3.select(this).select('rect').attr('stroke-width', 1.5); tipHide(); });
      return H;
    }

    function drawModBlock(g, child, x, y, w) {
      if (child._expanded) return drawModExpanded(g, child, x, y, w);
      return drawModCollapsed(g, child, x, y, w);
    }

    function drawModCollapsed(g, child, x, y, w) {
      const cOps = child.ops || [];
      const cChildren = child.children || [];
      const childDur = child.avg_dur_us || child.dur_us || 0;
      const repeatStr = child.repeat ? ` ×${child.repeat}` : '';
      const total = cOps.length + cChildren.length;
      const summaryLines = [];
      cChildren.forEach(cc => { summaryLines.push({ t: `${cc.class}: ${fmtUs(cc.avg_dur_us || cc.dur_us || 0)}`, c: '#c9d1d9' }); });
      cOps.slice(0, 3).forEach(op => {
        const gpuStr = op.gpu ? `→ ${op.gpu}` : (op.gpu_note || '');
        summaryLines.push({ t: `${op.op} ${fmtUs(op.avg_us || op.dur_us)} ${gpuStr}`, c: '#8b949e' });
      });
      if (cOps.length > 3) summaryLines.push({ t: `... +${cOps.length - 3} more ops`, c: '#484f58' });
      if (child.all_layer_durs) summaryLines.push({ t: `avg: ${fmtUs(child.avg_dur_us)} | min: ${fmtUs(child.min_dur_us)} | max: ${fmtUs(child.max_dur_us)}`, c: '#8b949e' });
      let nl = 2 + summaryLines.length;
      const H = Math.max(28, 4 + nl * 14);
      const cl = C.attn;
      const ng = g.append('g').attr('transform', `translate(${x},${y})`);
      ng.append('rect').attr('width', w).attr('height', H).attr('rx', 6)
        .attr('fill', cl.f).attr('stroke', cl.s).attr('stroke-width', total > 0 ? 2 : 1.5);
      let ty = 14;
      ng.append('text').attr('x', 10).attr('y', ty).attr('fill', '#e6edf3').attr('font-size', '11px').attr('font-weight', 'bold')
        .text(`${child.class}${repeatStr}`);
      const durStr = fmtUs(childDur);
      const bw = Math.max(durStr.length * 6 + 14, 40);
      ng.append('rect').attr('x', w - bw - 8).attr('y', 3).attr('width', bw).attr('height', 15).attr('rx', 7).attr('fill', cl.s);
      ng.append('text').attr('x', w - bw).attr('y', 13).attr('fill', '#fff').attr('font-size', '8px').attr('font-weight', 'bold').text(durStr);
      if (total > 0) ng.append('text').attr('x', w - 14).attr('y', 14).attr('fill', '#484f58').attr('font-size', '11px').text('▸');
      ty += 13;
      ng.append('text').attr('x', 10).attr('y', ty).attr('fill', '#8b949e').attr('font-size', '9px')
        .text(`${fmtUs(childDur)} | ${cChildren.length} sub-modules | ${cOps.length} ops`);
      summaryLines.forEach(d => { ty += 12; ng.append('text').attr('x', 12).attr('y', ty).attr('fill', d.c || '#8b949e').attr('font-size', '9px').text(d.t); });
      if (total > 0) {
        ng.style('cursor', 'pointer')
          .on('click', () => { child._expanded = true; render(); })
          .on('mouseover', function (evt) {
            d3.select(this).select('rect').attr('stroke-width', 3);
            tip(evt, buildModTooltip(child));
          })
          .on('mousemove', evt => d3.select('#tip').style('left', (evt.clientX + 12) + 'px').style('top', (evt.clientY - 10) + 'px'))
          .on('mouseout', function () { d3.select(this).select('rect').attr('stroke-width', 2); tipHide(); });
      }
      return H;
    }

    function drawModExpanded(g, child, x, y, w) {
      const childDur = child.avg_dur_us || child.dur_us || 0;
      const repeatStr = child.repeat ? ` ×${child.repeat}` : '';
      const cOps = child.ops || [];
      const cChildren = child.children || [];
      const headerH = 38, pad = 16;
      const innerX = x + pad, innerW = w - pad * 2;
      const innerStartY = y + headerH;
      const ng = g.append('g');
      const containerRect = ng.append('rect')
        .attr('x', x).attr('y', y).attr('width', w)
        .attr('rx', 8).attr('fill', '#0d1117')
        .attr('stroke', '#58a6ff').attr('stroke-width', 2);
      ng.append('text').attr('x', x + 12).attr('y', y + 18).attr('fill', '#58a6ff')
        .attr('font-size', '12px').attr('font-weight', 'bold')
        .text(`${child.class}${repeatStr}`);
      ng.append('text').attr('x', x + 12).attr('y', y + 32).attr('fill', '#8b949e')
        .attr('font-size', '9px')
        .text(`${fmtUs(childDur)} | ${cChildren.length} sub-modules | ${cOps.length} direct ops`);
      const durStr = fmtUs(childDur);
      const bw = Math.max(durStr.length * 6 + 14, 40);
      ng.append('rect').attr('x', x + w - bw - 30).attr('y', y + 5).attr('width', bw).attr('height', 15).attr('rx', 7).attr('fill', '#58a6ff');
      ng.append('text').attr('x', x + w - bw - 22).attr('y', y + 15).attr('fill', '#fff').attr('font-size', '8px').attr('font-weight', 'bold').text(durStr);
      ng.append('text').attr('x', x + w - 16).attr('y', y + 18).attr('fill', '#58a6ff')
        .attr('font-size', '11px').text('▾');
      ng.append('rect').attr('x', x).attr('y', y).attr('width', w).attr('height', headerH)
        .attr('fill', 'transparent').style('cursor', 'pointer')
        .on('click', () => { child._expanded = false; render(); });
      const finalY = renderModContent(ng, child, innerX, innerStartY, innerW);
      const totalH = Math.max(headerH + 10, finalY - y + 8);
      containerRect.attr('height', totalH);
      return totalH;
    }

    function dia(g, steps, { x = 60, y0 = 40, w = 500 } = {}) {
      let y = y0; const R = [];
      steps.forEach((s, i) => {
        let nl = 1; if (s.sub) nl++; nl += (s.items || []).length;
        const H = Math.max(28, 4 + nl * 14);
        const cl = s.col || C.sched;
        const ng = g.append('g').attr('transform', `translate(${x},${y})`);

        ng.append('rect').attr('width', w).attr('height', H).attr('rx', 6)
          .attr('fill', cl.f).attr('stroke', cl.s)
          .attr('stroke-width', s.click ? 2 : 1.5)
          .attr('stroke-dasharray', s.dashed ? '5,3' : null);

        let ty = 14;
        ng.append('text').attr('x', 10).attr('y', ty)
          .attr('fill', '#e6edf3').attr('font-size', '11px').attr('font-weight', 'bold')
          .text(s.label);

        if (s.badge) {
          const bw = Math.max(s.badge.length * 6 + 14, 40);
          ng.append('rect').attr('x', w - bw - 8).attr('y', 3).attr('width', bw).attr('height', 15).attr('rx', 7).attr('fill', cl.s);
          ng.append('text').attr('x', w - bw).attr('y', 13).attr('fill', '#fff').attr('font-size', '8px').attr('font-weight', 'bold').text(s.badge);
        }
        if (s.click) ng.append('text').attr('x', w - 14).attr('y', 14).attr('fill', '#484f58').attr('font-size', '11px').text('▸');

        if (s.sub) { ty += 13; ng.append('text').attr('x', 10).attr('y', ty).attr('fill', '#8b949e').attr('font-size', '9px').text(s.sub); }
        (s.items || []).forEach(d => { ty += 12; ng.append('text').attr('x', 12).attr('y', ty).attr('fill', d.c || '#8b949e').attr('font-size', '9px').text(d.t); });

        if (s.opData && s.opData.args) {
          ng.on('mouseover', function (evt) {
            if (s.click) d3.select(this).select('rect').attr('stroke-width', 3);
            tip(evt, flowTip(s.opData));
          }).on('mousemove', function (evt) {
            d3.select('#tip').style('left', (evt.clientX + 12) + 'px').style('top', (evt.clientY - 10) + 'px');
          }).on('mouseout', function () {
            if (s.click) d3.select(this).select('rect').attr('stroke-width', 2);
            tipHide();
          });
        }

        if (s.click) {
          ng.style('cursor', 'pointer').on('click', s.click);
          if (!s.opData || !s.opData.args) {
            ng.on('mouseover', function (evt) {
              d3.select(this).select('rect').attr('stroke-width', 3);
              if (s.tipHtml) tip(evt, s.tipHtml);
            })
              .on('mousemove', function (evt) { if (s.tipHtml) d3.select('#tip').style('left', (evt.clientX + 12) + 'px').style('top', (evt.clientY - 10) + 'px'); })
              .on('mouseout', function () {
                d3.select(this).select('rect').attr('stroke-width', 2);
                if (s.tipHtml) tipHide();
              });
          }
        }

        if (i > 0) {
          const p = R[i - 1], mx = x + w / 2, y1 = p.y + p.h, y2 = y;
          g.append('line').attr('x1', mx).attr('y1', y1).attr('x2', mx).attr('y2', y2)
